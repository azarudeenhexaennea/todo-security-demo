name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Default permissions are read-only.
permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------
  # 1. APPLICATION TESTS AND BUILDS
  # --------------------------------------------------
  app-checks:
    name: Application tests and builds
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [client, server]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Upload npm error log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-error-log-${{ matrix.app }}
          path: /home/runner/.npm/_logs/
          if-no-files-found: warn

      - name: Run tests
        run: npm test

      - name: Build frontend
        if: matrix.app == 'client'
        run: npm run build

      - name: Check backend syntax
        if: matrix.app == 'server'
        run: npm run check


  # --------------------------------------------------
  # 2. SEMGREP - SAST + AUTOMATIC FIX PR
  # --------------------------------------------------
  
  semgrep:
    name: Semgrep SAST and Autofix
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      # Generate the report outside the repository
      - name: Scan source
        run: semgrep scan --config auto --json --output /tmp/semgrep.json .
        continue-on-error: true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: /tmp/semgrep.json
          if-no-files-found: ignore

      # Apply autofixes only on trusted pushes
      - name: Apply Semgrep autofixes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: semgrep scan --config auto --autofix .

      # Create PR only when actual source files were modified
      - name: Create Semgrep fix PR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/semgrep-fixes
          delete-branch: true
          add-paths: |
            client/**
            server/**
            !client/node_modules/**
            !server/node_modules/**
          title: "Security: Semgrep autofixes"
          commit-message: "fix: apply Semgrep autofixes"
          body: |
            Automated code fixes generated by Semgrep.

            Only source code changes are included.
            Please review and test all changes before merging.



  # --------------------------------------------------
  # 3. OSV - DEPENDENCY VULNERABILITY SCAN
  # --------------------------------------------------
  osv:
    name: OSV dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --recursive
            --format
            json
            .
        continue-on-error: true


  # --------------------------------------------------
  # 4. GITLEAKS - SECRET DETECTION
  # --------------------------------------------------
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore


  # --------------------------------------------------
  # 5. TRIVY - FILESYSTEM SECURITY SCAN
  # --------------------------------------------------
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
